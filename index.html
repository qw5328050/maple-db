<script>
// ===== DATA =====
let MONSTERS = [], MAPS = [], ITEMS = [];
let MONSTER_BY_ID = {}, MAP_BY_ID = {}, ITEM_BY_ID = {};
let ENTRANCE_HINTS = {}, ITEM_ID_MAP = {}, ITEM_ID_MAP_REV = {};
let currentTab = 'monsters', currentDetail = null;
let allTowns = [];

const IMG_MOB = 'https://static.mxdzlk.com/CMS079/images/mob/';
const IMG_MAP = 'https://static.mxdzlk.com/images/map/';
const IMG_ITEM = 'https://static.mxdzlk.com/CMS079/images/item/';

function mobImg(id) { return IMG_MOB + id + '/preview.png'; }
function mapImg(id) {
  return `images/maps/${id}.png`; // 本地大图优先，onerror 时 fallback
}
function mapImgCdn(id) { return IMG_MAP + id + '.png'; }
function mapImgFallback(img) {
  if (img.src.includes('images/maps/')) {
    const id = img.src.split('/').pop().replace('.png','');
    img.src = IMG_MAP + id + '.png';
  } else {
    const card = img.closest('.card');
    if (card) card.remove();
    else img.style.display = 'none';
  }
}
function itemImg(id) {
  const realId = ITEM_ID_MAP[String(id)] || id;
  return IMG_ITEM + realId + '/preview.png';
}

async function init() {
  try {
    const [mResp, mpResp, iResp, eResp, imResp, revResp] = await Promise.all([
      fetch('data/monsters_detail.json'),
      fetch('data/maps_detail.json'),
      fetch('data/items.json').catch(() => ({json: () => []})),
      fetch('data/entrance_hints.json').catch(() => ({json: () => ({entrances: []})})),
      fetch('data/item_id_map.json').catch(() => ({json: () => ({})})),
      fetch('data/item_id_map_rev.json').catch(() => ({json: () => ({})}))
    ]);
    MONSTERS = await mResp.json();
    MAPS = await mpResp.json();
    ITEMS = (await iResp.json()).items || await iResp.json() || [];
    const eData = await eResp.json();

    for (const m of MONSTERS) MONSTER_BY_ID[m.id] = m;
    for (const m of MAPS) MAP_BY_ID[m.id] = m;
    for (const i of ITEMS) ITEM_BY_ID[i.id] = i;

    ENTRANCE_HINTS = {};
    for (const e of (eData.entrances || [])) {
      ENTRANCE_HINTS[e.hidden_map_id] = e;
    }

    ITEM_ID_MAP = await imResp.json();
    ITEM_ID_MAP_REV = await revResp.json();

    allTowns = [...new Set(MAPS.map(m => m.town).filter(Boolean))].sort();

    // Build monster area mapping for area filter
    MONSTERS.forEach(m => {
      const areas = new Set();
      (m.map_locations || []).forEach(loc => {
        const mp = MAP_BY_ID[loc.id];
        if (mp) areas.add(mp.area || mp.town || '未知');
      });
      m._areas = [...areas];
    });

    document.getElementById('search').addEventListener('input', debounce(render, 200));
    document.getElementById('clearSearch').addEventListener('click', () => {
      document.getElementById('search').value = '';
      render();
    });
    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', (e) => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      e.target.classList.add('active');
      currentTab = e.target.dataset.tab;
      currentDetail = null;
      document.getElementById('search').value = '';
      // Update placeholder per tab
      const ph = {monsters:'搜索怪物、物品、卷轴...', maps:'搜索地图...', items:'搜索物品...', navigate:'', value:'搜索装备名称...'};
      document.getElementById('search').placeholder = ph[currentTab] || '';
      render();
    }));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && currentDetail) { closeDetail(); }
    });

    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>数据加载失败: ${e.message}</div>`;
  }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ===== RENDER =====
function render() {
  if (currentDetail) { renderDetail(); return; }
  const q = document.getElementById('search').value.trim();
  document.getElementById('clearSearch').style.display = q ? 'block' : 'none';
  
  switch(currentTab) {
    case 'monsters': renderMonsters(q); break;
    case 'maps': renderMaps(q); break;
    case 'items': renderItems(q); break;
    case 'navigate': renderNavigate(); break;
    case 'value': renderValue(q); break;
  }
}

function fmtNum(n) {
  const num = parseInt(String(n).replace(/[^0-9]/g, ''));
  if (!num) return String(n);
  if (num >= 10000) return (num/10000).toFixed(1) + '万';
  return num.toLocaleString();
}

          <datalist id="toList">${allMaps.slice(0, 300).map(m => `<option data-mapid="${m.id}" value="${m.cn_name || '?'} · ${m.town || ''}">`).join('')}</datalist>

function resolveMapId(text) {
  if (!text) return '';
  const m = MAPS.find(m => `${m.cn_name || '?'} · ${m.town || ''}` === text);
  return m ? m.id : '';
}

function updateNavDatalist(listId, optId, q) {
  const datalist = document.getElementById(listId);
  if (!datalist) return;
  const isFrom = listId === 'fromList';
  
  if (!q || q.length < 1) {
    datalist.innerHTML = (isFrom 
      ? MAPS.filter(m => m.town && (m.monsters || []).length === 0)
      : MAPS.filter(m => (m.monsters || []).length > 0))
      .slice(0, 300).map(m => `<option value="${m.cn_name || '?'} · ${m.town || ''}">`).join('');
    return;
  }
  
  const ql = q.toLowerCase();
  const matches = MAPS.filter(m => {
    if ((m.cn_name || '').toLowerCase().includes(ql)) return true;
    if ((m.town || '').toLowerCase().includes(ql)) return true;
    if (String(m.id).includes(ql)) return true;
    // Also search monsters on this map
    if ((m.monsters || []).some(mo => 
      (mo.cn_name || '').toLowerCase().includes(ql) ||
      (mo.en_name || '').toLowerCase().includes(ql)
    )) return true;
    return false;
  }).slice(0, 50);
  
  datalist.innerHTML = matches.map(m => 
    `<option value="${m.cn_name || '?'} · ${m.town || ''}">`
  ).join('');
  
  // Match by input value to set mapid
  const match = MAPS.find(m => `${m.cn_name || '?'} · ${m.town || ''}` === q);
  if (isFrom) navFrom = match ? match.id : '';
  else navTo = match ? match.id : '';
}

function findRoute() {
  const from = navFrom, to = navTo;
  if (!from || !to) { document.getElementById('routeResult').innerHTML = '<div class="empty-state">请选择出发地和目的地</div>'; return; }
  
  const graph = {};
  for (const m of MAPS) {
    graph[m.id] = graph[m.id] || [];
    for (const eid of (m.exits || [])) {
      graph[m.id].push(String(eid));
      graph[String(eid)] = graph[String(eid)] || [];
      if (!graph[String(eid)].includes(m.id)) graph[String(eid)].push(m.id);
    }
  }
  
  const visited = new Set([from]), parent = {[from]: null}, queue = [from]; let found = false;
  while (queue.length) {
    const cur = queue.shift();
    if (cur === to) { found = true; break; }
    for (const n of (graph[cur] || [])) { if (!visited.has(n)) { visited.add(n); parent[n] = cur; queue.push(n); } }
  }
  
  if (!found) { document.getElementById('routeResult').innerHTML = '<div class="empty-state">⚠️ 未找到可行路线（可能出发点与目的地不在连通区域内）</div>'; return; }
  
  const path = []; let c = to;
  while (c) { path.unshift(c); c = parent[c]; }
  
  const steps = path.map((id, i) => {
    const m = MAP_BY_ID[id] || {};
    const name = m.cn_name || `#${id}`;
    const mons = (m.monsters || []).slice(0, 3).map(x => x.cn_name).join(', ');
    const hint = ENTRANCE_HINTS[id];
    const hintHtml = hint ? `
      <div style="margin-top:8px;background:rgba(240,136,62,0.06);border:2px dashed var(--accent);border-radius:8px;overflow:hidden">
        ${hint.image ? `<img src="${hint.image}" style="width:100%;max-height:300px;object-fit:contain;display:block;background:#111;border-bottom:1px solid rgba(240,136,62,0.2)" alt="隐藏入口截图" loading="lazy" class="entrance-img" onclick="event.stopPropagation();enlargeImg(this.src)" onerror="this.style.display='none'">` : '<div style="padding:24px 16px;text-align:center;color:var(--text2);background:rgba(240,136,62,0.04);font-size:12px">📸 入口截图开发中</div>'}
        <div style="padding:8px 10px;font-size:12px">
          <span style="color:var(--accent);font-weight:600">🔍 隐藏入口 · 从「${hint.parent_map_name}」</span>
          <div style="color:var(--text2);margin-top:2px">${hint.description}</div>
          <div style="color:var(--text2);margin-top:2px">${hint.method==='press_up' ? '⬆️按↑' : hint.method==='jump_down' ? '⬇️跳下' : hint.method==='npc' ? '💬NPC' : '🚶步行'} · ${hint.position}</div>
        </div>
      </div>` : '';
    return `<div class="info-item" style="margin:8px 0;border-left:3px solid var(--accent)">
      <strong>${i+1}.</strong> <a href="javascript:void(0)" onclick="currentTab='maps';showDetail('map','${id}')" style="color:var(--accent);text-decoration:underline;cursor:pointer" title="查看地图详情">${name}</a> ${m.town ? '🏠' : ''}
      ${mons ? `<div style="font-size:11px;color:var(--text2)">🐾 ${mons}</div>` : ''}
      ${hintHtml}
      ${i < path.length-1 ? '<div style="text-align:center;color:var(--text2);margin-top:4px">↓</div>' : ' 🎯'}
    </div>`;
  }).join('');
  
  document.getElementById('routeResult').innerHTML = `
    <div class="section" style="margin-top:16px"><h3>📋 路线 (${path.length-1} 步)</h3>${steps}
    <div style="margin-top:8px;color:var(--text2);font-size:12px">⚠️ 路线基于地图ID推算，仅供参考。以游戏内实际传送口为准。</div></div>`;
}

// ===== DETAIL VIEWS =====
function showDetail(type, id) {
  let data;
  if (type === 'monster') data = MONSTER_BY_ID[id];
  else if (type === 'map') data = MAP_BY_ID[id];
  else if (type === 'item') {
    // Try our ID first, then reverse mapping (mxdzlk → our)
    data = ITEM_BY_ID[id];
    if (!data) {
      const revId = ITEM_ID_MAP_REV[String(id)];
      if (revId) data = ITEM_BY_ID[revId];
    }
  }
  if (!data) return;
  currentDetail = {type, data};
  renderDetail();
}

function closeDetail() { currentDetail = null; render(); }

function renderDetail() {
  if (!currentDetail) return;
  const {type, data} = currentDetail;
  if (type === 'monster') renderMonsterDetail(data);
  else if (type === 'map') renderMapDetail(data);
  else if (type === 'item') renderItemDetail(data);
}

      ${maps.length > 0 ? `

// ===== VALUE (装备估价) =====
let vSortKey = '_score', vSortDir = -1, vTypeFilter = '';

function sortValue(key) {
  if (vSortKey === key) vSortDir = -vSortDir;
  else { vSortKey = key; vSortDir = -1; }
  render();
}

function calcScore(item) {
  const s = item.stats || {};
  const incPAD = parseInt(s.incPAD) || 0;
  const incMAD = parseInt(s.incMAD) || 0;
  const incSTR = parseInt(s.incSTR) || 0;
  const incDEX = parseInt(s.incDEX) || 0;
  const incINT = parseInt(s.incINT) || 0;
  const incLUK = parseInt(s.incLUK) || 0;
  const incACC = parseInt(s.incACC) || 0;
  const incEVA = parseInt(s.incEVA) || 0;
  const incSpeed = parseInt(s.incSpeed) || 0;
  const incJump = parseInt(s.incJump) || 0;
  const incPDD = parseInt(s.incPDD) || 0;
  const incMDD = parseInt(s.incMDD) || 0;
  const tuc = parseInt(s.tuc) || 0;
  const reqLevel = parseInt(s.reqLevel) || 1;
  const reqJob = parseInt(s.reqJob) || 0;

  // Exclude GM items (reqLevel=0 or 999 all stats)
  if (reqLevel === 0) return -1;
  if (incSTR >= 900 && incDEX >= 900 && incINT >= 900 && incLUK >= 900) return -1;

  const isWeapon = item.sub_category === 'Weapon';
  // Base stat power
  let base;
  if (isWeapon) {
    base = incPAD * 12 + incMAD * 8 + (incSTR + incDEX + incINT + incLUK) * 3;
  } else {
    base = incPAD * 5 + incMAD * 3 + (incSTR + incDEX + incINT + incLUK) * 4
      + incACC * 3 + incEVA * 3 + Math.floor((incPDD + incMDD) / 3)
      + incSpeed + incJump * 2;
  }

  // Level factor: lower level = bonus, capped at 3x
  const lv = Math.max(reqLevel, 1);
  const levelFactor = Math.min(3.0, 1.0 + 15.0 / (lv + 5));

  // Slot value — upgrade potential
  const slotVal = tuc * 30;

  // All-class + high slot bonus (锅盖, 工地手套, 桑拿服 etc.)
  const allClass = reqJob === 0;
  let classBonus = 1.0;
  if (allClass && tuc >= 5) classBonus = 1.2;
  if (allClass && tuc >= 10) classBonus = 1.3;

  const score = (base * levelFactor + slotVal) * classBonus;
  return score;
}

// ===== SCROLL SCORING (卷轴估价) =====
function parseScroll(item) {
  const name = item.name || '';
  const desc = item.description || '';
  // 从 "手套攻击卷轴60%/Gloves ATT 60%" 中解析
  const cnPart = name.split('/')[0] || '';
  // 成功率
  const rateMatch = cnPart.match(/(\d+)%/);
  const rate = rateMatch ? parseInt(rateMatch[1]) : 60;
  // 部位映射
  const slotMap = [
    {re:/手套|Gloves?/i, slot:'手套', icon:'🧤'},
    {re:/单手剑|1H Sword/i, slot:'单手剑', icon:'🗡️'},
    {re:/双手剑|2H Sword/i, slot:'双手剑', icon:'⚔️'},
    {re:/单手钝器|1H BW/i, slot:'单手钝器', icon:'🔨'},
    {re:/单手斧|1H Axe/i, slot:'单手斧', icon:'🪓'},
    {re:/枪|Spear/i, slot:'枪', icon:'🔱'},
    {re:/弓(?!箭)|Bow(?!man)/i, slot:'弓', icon:'🏹'},
    {re:/弩|Crossbow/i, slot:'弩', icon:'🎯'},
    {re:/披风|Cape/i, slot:'披风', icon:'🧣'},
    {re:/耳环|Earring/i, slot:'耳环', icon:'💎'},
    {re:/头盔|Helmet/i, slot:'头盔', icon:'🎩'},
    {re:/上衣|Top/i, slot:'上衣', icon:'👕'},
    {re:/裤|Bottom/i, slot:'裤子', icon:'👖'},
    {re:/鞋子|Shoes/i, slot:'鞋子', icon:'👟'},
    {re:/盾牌|Shield/i, slot:'盾牌', icon:'🛡️'},
    {re:/套服|Overall/i, slot:'套服', icon:'👘'},
  ];
  let slot='未知', icon='📜';
  for (const s of slotMap) { if (s.re.test(cnPart)) { slot=s.slot; icon=s.icon; break; } }
  // 效果类型
  const effMap = [
    {re:/攻击|ATT/i, eff:'攻击', ekey:'atk'},
    {re:/魔力|M.?ATT/i, eff:'魔力', ekey:'matk'},
    {re:/运气|LUK/i, eff:'运气', ekey:'luk'},
    {re:/智力|INT/i, eff:'智力', ekey:'int'},
    {re:/敏捷|DEX/i, eff:'敏捷', ekey:'dex'},
    {re:/体力|HP(?!%)/i, eff:'HP', ekey:'hp'},
    {re:/防御|DEF/i, eff:'防御', ekey:'def'},
    {re:/跳跃|Jump/i, eff:'跳跃', ekey:'jump'},
    {re:/速度|Speed/i, eff:'速度', ekey:'speed'},
  ];
  let effect='未知', ekey='';
  for (const e of effMap) { if (e.re.test(cnPart)) { effect=e.eff; ekey=e.ekey; break; } }
  return {slot, icon, effect, ekey, rate};
}

function calcScrollScore(item) {
  const p = parseScroll(item);
  // 效果基础分
  const effScore = {atk:300, matk:150, luk:100, int:80, dex:60, str:60, def:15, hp:10, mp:10, jump:15, speed:15}[p.ekey] || 10;
  // 成功率加成（10%卷属性更好，所以更贵）
  const rateBonus = p.rate <= 10 ? 2.0 : (p.rate <= 30 ? 1.5 : 1.0);
  // 部位加成
  const slotBonus = {手套:2.0, 单手剑:1.5, 双手剑:1.5, 单手钝器:1.0, 单手斧:1.0, 枪:1.5, 弓:1.5, 弩:1.3, 披风:1.3, 耳环:1.2, 头盔:1.1, 上衣:1.0, 裤子:1.0, 鞋子:1.0, 盾牌:1.0, 套服:1.0}[p.slot] || 1.0;
  return effScore * rateBonus * slotBonus;
}

function renderValue(q) {
  const equipment = ITEMS.filter(i => {
    const s = i.stats || {};
    // Include any equipment with stats, defense, or upgrade slots
    const hasValue = s.incPAD || s.incMAD || s.incSTR || s.incDEX || s.incINT || s.incLUK
      || s.incACC || s.incEVA || s.incPDD || s.incMDD || s.incSpeed || s.incJump;
    if (!hasValue && !s.tuc) return false;
    // Filter GM items
    if (parseInt(s.reqLevel) === 0) return false;
    if (parseInt(s.incSTR)>=900 && parseInt(s.incDEX)>=900 && parseInt(s.incINT)>=900 && parseInt(s.incLUK)>=900) return false;
    return true;
  });

  // Score each item
  const scored = equipment.map(i => {
    const s = i.stats || {};
    const score = calcScore(i);
    return {
      ...i,
      _score: score,
      _atk: parseInt(s.incPAD) || 0,
      _matk: parseInt(s.incMAD) || 0,
      _str: parseInt(s.incSTR) || 0,
      _dex: parseInt(s.incDEX) || 0,
      _int: parseInt(s.incINT) || 0,
      _luk: parseInt(s.incLUK) || 0,
      _tuc: parseInt(s.tuc) || 0,
      _lv: parseInt(s.reqLevel) || 1,
      _acc: parseInt(s.incACC) || 0,
      _eva: parseInt(s.incEVA) || 0,
      _pdd: parseInt(s.incPDD) || 0,
      _mdd: parseInt(s.incMDD) || 0
    };
  });

  // Filter by search
  let filtered = scored;
  if (q) {
    const ql = q.toLowerCase();
    filtered = filtered.filter(i => 
      (i.name || '').toLowerCase().includes(ql) ||
      (i.sub_category || '').toLowerCase().includes(ql) ||
      String(i.id).includes(ql)
    );
  }

  // Sort
  filtered.sort((a, b) => {
    let va = a[vSortKey] || 0, vb = b[vSortKey] || 0;
    if (typeof va === 'string') return va.localeCompare(vb) * vSortDir;
    return (va - vb) * vSortDir;
  });

  // Column headers
  const sortIcon = (key) => {
    if (vSortKey === key) return vSortDir === -1 ? ' ▼' : ' ▲';
    return '';
  };
  const clickSort = (key) => `onclick="sortValue('${key}')"`;

  const subCats = [...new Set(scored.map(i => i.sub_category).filter(Boolean))].sort();
  const typeIcons = {Weapon:'⚔️', Hat:'🎩', Top:'👕', Bottom:'👖', Overall:'👘', Shoes:'👟', Glove:'🧤', Shield:'🛡️', Earring:'💎', Cape:'🧣'};
  const typeNames = {Weapon:'武器/Weapon', Hat:'帽子/Hat', Top:'上衣/Top', Bottom:'裤子/Bottom', Overall:'套装/Overall', Shoes:'鞋子/Shoes', Glove:'手套/Glove', Shield:'盾牌/Shield', Earring:'耳环/Earring', Cape:'披风/Cape'};

  let html = '<div class="filters" style="margin-bottom:12px">';
  html += `<span style="font-size:13px;color:var(--text2);margin-right:8px">类型:</span>`;
  html += `<span class="filter-tag${!vTypeFilter?' active':''}" onclick="vTypeFilter='';render()">全部</span>`;
  for (const cat of subCats) {
    const icon = typeIcons[cat] || '';
    const tname = typeNames[cat] || cat;
    html += `<span class="filter-tag${vTypeFilter===cat?' active':''}" onclick="vTypeFilter='${cat}';render()">${icon} ${tname}</span>`;
  }
  // 卷轴 chip
  html += `<span class="filter-tag${vTypeFilter==='Scroll'?' active':''}" onclick="vTypeFilter='Scroll';render()">📜 卷轴/Scroll</span>`;
  html += '</div>';

  // === 卷轴分支 ===
  if (vTypeFilter === 'Scroll') {
    const scrolls = ITEMS.filter(i => i.category === 'Consumable' && i.sub_category === 'Scroll');
    const scoredScrolls = scrolls.map(s => ({...s, _score: calcScrollScore(s), _parsed: parseScroll(s)})).filter(s => s._score > 0);

    let sFiltered = scoredScrolls;
    if (q) {
      const ql = q.toLowerCase();
      sFiltered = sFiltered.filter(i => (i.name||'').toLowerCase().includes(ql) || String(i.id).includes(ql));
    }
    sFiltered.sort((a,b)=>(b._score-a._score));

    html += `<div class="result-count">共 ${sFiltered.length} 张卷轴（按价值排序）</div>`;
    if (sFiltered.length === 0) {
      html += '<div class="empty-state"><div class="icon">📜</div><div>没有匹配的卷轴</div></div>';
    } else {
      html += '<div style="overflow-x:auto"><table class="link-table" style="font-size:13px">';
      html += `<thead><tr>
        <th></th><th>名称</th><th>适用部位</th><th>效果</th><th style="text-align:center">成功率</th>
        <th>💰评分</th></tr></thead><tbody>`;
      for (const s of sFiltered) {
        const p = s._parsed;
        html += `<tr onclick="showDetail('item','${s.id}')" style="cursor:pointer">
          <td><img src="${itemImg(s.id)}" loading="lazy" onerror="this.style.display='none'" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated;border-radius:4px"></td>
          <td style="font-weight:500">${s.name || '?'}</td>
          <td>${p.icon} ${p.slot}</td>
          <td style="color:var(--accent2)">${p.effect}</td>
          <td style="text-align:center;font-weight:600;color:${p.rate<=10?'var(--red)':'var(--accent2)'}">${p.rate}%</td>
          <td style="font-weight:700;color:var(--accent)">${Math.round(s._score)}</td>
        </tr>`;
      }
      html += '</tbody></table></div>';
    }
    document.getElementById('content').innerHTML = html;
    return;
  }

  // === 装备分支（原有逻辑） ===
  if (vTypeFilter) {
    filtered = filtered.filter(i => i.sub_category === vTypeFilter);
  }

  html += `<div class="result-count">共 ${filtered.length} 件装备（按综合价值排序）</div>`;

  if (filtered.length === 0) {
    html += '<div class="empty-state"><div class="icon">🔍</div><div>没有匹配的装备</div></div>';
  } else {
    html += '<div style="overflow-x:auto"><table class="link-table" style="font-size:13px">';
    html += `<thead><tr>
      <th></th>
      <th style="cursor:pointer" ${clickSort('name')}>名称${sortIcon('name')}</th>
      <th>类型</th>
      <th style="cursor:pointer" ${clickSort('_lv')}>等级${sortIcon('_lv')}</th>
      <th style="cursor:pointer" ${clickSort('_atk')}>攻击${sortIcon('_atk')}</th>
      <th style="cursor:pointer" ${clickSort('_matk')}>魔攻${sortIcon('_matk')}</th>
      <th style="cursor:pointer" ${clickSort('_str')}>力量${sortIcon('_str')}</th>
      <th style="cursor:pointer" ${clickSort('_dex')}>敏捷${sortIcon('_dex')}</th>
      <th style="cursor:pointer" ${clickSort('_int')}>智力${sortIcon('_int')}</th>
      <th style="cursor:pointer" ${clickSort('_luk')}>运气${sortIcon('_luk')}</th>
      <th style="cursor:pointer" ${clickSort('_tuc')}>卷次${sortIcon('_tuc')}</th>
      <th style="cursor:pointer" ${clickSort('_score')}>💰评分${sortIcon('_score')}</th>
    </tr></thead><tbody>`;

    for (const i of filtered) {
      const s = i.stats || {};
      const reqJob = JOB_LABELS[s.reqJob] || s.req_job_label || '全职业';
      html += `<tr onclick="showDetail('item','${i.id}')" style="cursor:pointer">
        <td><img src="${itemImg(i.id)}" loading="lazy" onerror="this.style.display='none'" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated;border-radius:4px"></td>
        <td style="font-weight:500">${i.name || '?'}</td>
        <td style="color:var(--text2)">${typeIcons[i.sub_category]||''} ${typeNames[i.sub_category]||i.sub_category||''}<br><span style="font-size:10px">${reqJob}</span></td>
        <td>${i._lv}</td>
        <td style="color:var(--red)">${i._atk || '-'}</td>
        <td style="color:var(--purple)">${i._matk || '-'}</td>
        <td>${i._str || '-'}</td>
        <td>${i._dex || '-'}</td>
        <td>${i._int || '-'}</td>
        <td>${i._luk || '-'}</td>
        <td style="color:var(--accent2)">${i._tuc}</td>
        <td style="font-weight:700;color:var(--accent)">${Math.round(i._score)}</td>
      </tr>`;
    }
    html += '</tbody></table></div>';
  }

  document.getElementById('content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', init);

function enlargeImg(src) {
  const lb = document.getElementById('imgLightbox');
  document.getElementById('imgLightboxImg').src = src;
  lb.classList.add('show');
}
</script>

<div class="img-lightbox" id="imgLightbox" onclick="this.classList.remove('show')"><span class="close-hint">&times;</span><img id="imgLightboxImg" src="" alt="放大查看"></div>

<!-- 赞赏码弹窗 -->
<div class="qr-popup" id="donateQr" onclick="this.classList.remove('show')">
  <div class="qr-card" onclick="event.stopPropagation()">
    <img src="images/donate/wechat.png" alt="微信赞赏码" onerror="this.outerHTML='<p style=padding:30px;color:var(--text2);text-align:center>请将赞赏码截图保存为<br><code style=color:var(--accent)>images/donate/wechat.png</code></p>'">
    <p style="font-size:13px;color:var(--text2);margin-top:10px">微信扫码 · 金额随意</p>
    <p style="font-size:11px;color:var(--text2);margin-top:4px">点击空白处关闭</p>
  </div>
</div>

</body>
